# Alacritty configuration for Windows (Alacritty 0.17+).
#
# Deploy or symlink this file together with alacritty.local.toml to:
#   %APPDATA%\alacritty\
#
# With live_config_reload enabled, edits are picked up without restarting
# the terminal.

[general]
# Machine-local overrides (e.g. working_directory) are imported from the
# gitignored alacritty.local.toml; see alacritty.local.example.toml.
import = ["alacritty.local.toml"]
live_config_reload = true

[terminal]
shell = { program = "pwsh", args = ["-NoLogo"] }
osc52 = "OnlyCopy"

[window]
dynamic_padding = true
padding = { x = 6, y = 6 }
startup_mode = "Windowed"
dynamic_title = true

[scrolling]
history = 10000

# Sarasa Term SC: Latin + CJK term font. Only the Regular TTC is installed on
# this machine, so Bold/Italic are synthesized by the font renderer.
[font]
normal = { family = "Sarasa Term SC", style = "Regular" }
bold = { family = "Sarasa Term SC", style = "Bold" }
italic = { family = "Sarasa Term SC", style = "Italic" }
bold_italic = { family = "Sarasa Term SC", style = "Bold Italic" }
size = 11.0

# Solarized Light
[colors.primary]
background = "#fdf6e3"
foreground = "#657b83"

[colors.normal]
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
white = "#eee8d5"

[colors.bright]
black = "#002b36"
red = "#cb4b16"
green = "#586e75"
yellow = "#657b83"
blue = "#839496"
magenta = "#6c71c4"
cyan = "#93a1a1"
white = "#fdf6e3"

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Beam", blinking = "Off" }
unfocused_hollow = true
